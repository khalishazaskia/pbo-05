<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi CRUD User - Konsep PBO</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    nav { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    nav button { padding: 8px 16px; cursor: pointer; border: none; background: #e0e0e0; border-radius: 4px; font-weight: bold; }
    nav button.active { background: #007bff; color: white; }
    .page { display: none; }
    .page.active { display: block; }
    
    /* Form Styles */
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .btn { padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .btn-danger { background: #dc3545; }
    .btn-edit { background: #ffc107; color: #000; }
    
    /* Table Styles */
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #f8f9fa; }
    
    /* Badge & Card Styles */
    .badge { padding: 4px 8px; border-radius: 4px; color: white; font-size: 12px; font-weight: bold; }
    .badge-admin { background-color: #d9534f; }
    .badge-regular { background-color: #0275d8; }
    .profile-card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; background: #fafafa; }
  </style>
</head>
<body>

<div class="container">
  <!-- Navigasi 3 Halaman -->
  <nav>
    <button id="nav-login" class="active" onclick="showPage('login')">1. Login</button>
    <button id="nav-users" onclick="showPage('users')">2. Daftar User (CRUD)</button>
    <button id="nav-profile" onclick="showPage('profile')">3. Profile</button>
  </nav>

  <!-- Halaman 1: Login -->
  <div id="page-login" class="page active">
    <h2>Login Akun</h2>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="loginUsername">Username:</label>
        <input type="text" id="loginUsername" required placeholder="Masukkan username...">
      </div>
      <button type="submit" class="btn">Login</button>
    </form>
    <p><small>*Catatan: Anda bisa menambahkan user baru di halaman "Daftar User" terlebih dahulu jika data kosong.</small></p>
  </div>

  <!-- Halaman 2: Daftar User (CRUD) -->
  <div id="page-users" class="page">
    <h2 id="formTitle">Tambah User Baru</h2>
    <form id="userForm" onsubmit="handleSaveUser(event)">
      <input type="hidden" id="userId">
      <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" required>
      </div>
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="role">Role (Tipe Objek):</label>
        <select id="role">
          <option value="Regular">Regular User</option>
          <option value="Admin">Administrator</option>
        </select>
      </div>
      <button type="submit" class="btn" id="btnSave">Simpan User</button>
      <button type="button" class="btn btn-danger" onclick="resetForm()" style="display:none;" id="btnCancel">Batal</button>
    </form>

    <hr style="margin: 20px 0;">

    <h2>Daftar User</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Email</th>
          <th>Role (Polimorfisme Badge)</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="userTableBody"></tbody>
    </table>
  </div>

  <!-- Halaman 3: Profile -->
  <div id="page-profile" class="page">
    <h2>Profil User Aktif</h2>
    <div id="profileContainer">
      <p><em>Belum ada user yang login. Silakan login terlebih dahulu.</em></p>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // KONSEP PBO / OOP (Object-Oriented Programming)
  // ==========================================

  // 1. KELAS INDUK (Parent Class / Base Class)
  class User {
    constructor(id, username, email, role) {
      this.id = id;
      this.username = username;
      this.email = email;
      this.role = role;
    }

    // Method Dasar (Akan di-override di kelas anak -> Polimorfisme)
    getRoleBadge() {
      return `<span class="badge" style="background:gray">${this.role}</span>`;
    }

    getProfileCard() {
      return `
        <div class="profile-card">
          <h3>User: ${this.username}</h3>
          <p>Email: ${this.email}</p>
          <p>Role: ${this.getRoleBadge()}</p>
        </div>
      `;
    }
  }

  // 2. KELAS ANAK 1 (Child Class - Pewarisan & Polimorfisme)
  class AdminUser extends User {
    constructor(id, username, email) {
      super(id, username, email, 'Admin'); // Memanggil constructor milik kelas induk
    }

    // Polimorfisme: Override method getRoleBadge
    getRoleBadge() {
      return `<span class="badge badge-admin">ADMINISTRATOR</span>`;
    }

    // Polimorfisme: Override method getProfileCard
    getProfileCard() {
      return `
        <div class="profile-card" style="border-left: 5px solid #d9534f;">
          <h3>👑 Profil Admin: ${this.username}</h3>
          <p><strong>Email:</strong> ${this.email}</p>
          <p><strong>Tipe Akses:</strong> ${this.getRoleBadge()}</p>
          <p><strong>Hak Akses:</strong> Akses Penuh Sistem (CRUD Data)</p>
        </div>
      `;
    }
  }

  // 3. KELAS ANAK 2 (Child Class - Pewarisan & Polimorfisme)
  class RegularUser extends User {
    constructor(id, username, email) {
      super(id, username, email, 'Regular'); // Memanggil constructor milik kelas induk
    }

    // Polimorfisme: Override method getRoleBadge
    getRoleBadge() {
      return `<span class="badge badge-regular">REGULAR USER</span>`;
    }

    // Polimorfisme: Override method getProfileCard
    getProfileCard() {
      return `
        <div class="profile-card" style="border-left: 5px solid #0275d8;">
          <h3>👤 Profil Pengguna: ${this.username}</h3>
          <p><strong>Email:</strong> ${this.email}</p>
          <p><strong>Tipe Akses:</strong> ${this.getRoleBadge()}</p>
          <p><strong>Hak Akses:</strong> Akses Baca Standar</p>
        </div>
      `;
    }
  }

  // Factory Function untuk instansiasi Objek berdasarkan tipe Role
  function createUserInstance(data) {
    if (data.role === 'Admin') {
      return new AdminUser(data.id, data.username, data.email);
    } else {
      return new RegularUser(data.id, data.username, data.email);
    }
  }

  // ==========================================
  // LOGIKA APLIKASI & LOCALSTORAGE
  // ==========================================

  let usersData = [];
  let currentUser = null;

  // Inisialisasi Data Default jika LocalStorage kosong
  function initData() {
    const stored = localStorage.getItem('app_users');
    if (!stored) {
      usersData = [
        { id: 1, username: 'admin_utama', email: 'admin@app.com', role: 'Admin' },
        { id: 2, username: 'budi_santoso', email: 'budi@app.com', role: 'Regular' }
      ];
      saveToStorage();
    } else {
      usersData = JSON.parse(stored);
    }
    renderTable();
  }

  function saveToStorage() {
    localStorage.setItem('app_users', JSON.stringify(usersData));
  }

  // 1. Fungsi Navigasi Halaman
  function showPage(pageName) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));

    document.getElementById(`page-${pageName}`).classList.add('active');
    document.getElementById(`nav-${pageName}`).classList.add('active');

    if (pageName === 'profile') {
      renderProfile();
    }
  }

  // 2. Fungsi CRUD
  function renderTable() {
    const tbody = document.getElementById('userTableBody');
    tbody.innerHTML = '';

    usersData.forEach(item => {
      // Polimorfisme: Membuat instance objek lalu memanggil method objek
      const userObj = createUserInstance(item);

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${userObj.id}</td>
        <td>${userObj.username}</td>
        <td>${userObj.email}</td>
        <td>${userObj.getRoleBadge()}</td> <!-- Panggilan Polimorfisme -->
        <td>
          <button class="btn btn-edit" onclick="editUser(${userObj.id})">Edit</button>
          <button class="btn btn-danger" onclick="deleteUser(${userObj.id})">Hapus</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function handleSaveUser(e) {
    e.preventDefault();
    const id = document.getElementById('userId').value;
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const role = document.getElementById('role').value;

    if (id) {
      // Mode Update
      const index = usersData.findIndex(u => u.id == id);
      if (index !== -1) {
        usersData[index] = { id: parseInt(id), username, email, role };
      }
    } else {
      // Mode Create
      const newId = usersData.length > 0 ? Math.max(...usersData.map(u => u.id)) + 1 : 1;
      usersData.push({ id: newId, username, email, role });
    }

    saveToStorage();
    renderTable();
    resetForm();
  }

  function editUser(id) {
    const user = usersData.find(u => u.id === id);
    if (user) {
      document.getElementById('userId').value = user.id;
      document.getElementById('username').value = user.username;
      document.getElementById('email').value = user.email;
      document.getElementById('role').value = user.role;

      document.getElementById('formTitle').innerText = 'Edit User';
      document.getElementById('btnSave').innerText = 'Update User';
      document.getElementById('btnCancel').style.display = 'inline-block';
    }
  }

  function deleteUser(id) {
    if (confirm('Apakah Anda yakin ingin menghapus user ini?')) {
      usersData = usersData.filter(u => u.id !== id);
      saveToStorage();
      renderTable();
    }
  }

  function resetForm() {
    document.getElementById('userId').value = '';
    document.getElementById('userForm').reset();
    document.getElementById('formTitle').innerText = 'Tambah User Baru';
    document.getElementById('btnSave').innerText = 'Simpan User';
    document.getElementById('btnCancel').style.display = 'none';
  }

  // 3. Login & Profile
  function handleLogin(e) {
    e.preventDefault();
    const inputUsername = document.getElementById('loginUsername').value;
    const foundUser = usersData.find(u => u.username.toLowerCase() === inputUsername.toLowerCase());

    if (foundUser) {
      currentUser = createUserInstance(foundUser);
      alert(`Selamat datang, ${currentUser.username}!`);
      showPage('profile');
    } else {
      alert('Username tidak ditemukan! Silakan daftar di halaman "Daftar User".');
    }
  }

  function renderProfile() {
    const container = document.getElementById('profileContainer');
    if (currentUser) {
      // Polimorfisme: Memanggil getProfileCard() yang sudah di-override
      container.innerHTML = currentUser.getProfileCard();
    } else {
      container.innerHTML = '<p><em>Belum ada user yang login. Silakan login di Halaman Login.</em></p>';
    }
  }

  // Jalankan inisialisasi saat halaman dimuat
  initData();
</script>

</body>
</html>
